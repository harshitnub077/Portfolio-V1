      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>
    <linearGradient id="nsBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
